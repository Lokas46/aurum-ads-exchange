version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aurumads
      POSTGRES_PASSWORD: aurumads_secret
      POSTGRES_DB: aurumads
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurumads"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://aurumads:aurumads_secret@db:5432/aurumads
      BOT_TOKEN: ${BOT_TOKEN}
      CRYPTOBOT_API_KEY: ${CRYPTOBOT_API_KEY}
      API_BASE_URL: ${API_BASE_URL}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      ADMIN_IDS: ${ADMIN_IDS}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

volumes:
  pgdata:
